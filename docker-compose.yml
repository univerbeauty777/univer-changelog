version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: univerchangelog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha_segura_aqui
      POSTGRES_DB: univerchangelog
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: univerchangelog_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:senha_segura_aqui@postgres:5432/univerchangelog
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node server.js"

volumes:
  postgres_data:
